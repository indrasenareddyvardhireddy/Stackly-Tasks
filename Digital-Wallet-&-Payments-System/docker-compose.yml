services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: wallet_db
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      retries: 20
    volumes: [dbdata:/var/lib/mysql]
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://root:password@db:3306/wallet_db
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes: ["./statements:/code/statements"]
volumes:
  dbdata:
